name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    # The Worker serves the dashboard SPA from the ASSETS binding, so `dist-admin`
    # has to exist before `wrangler deploy` runs. `npm run deploy` builds it first.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix admin

      # Uses the wrangler pinned in package.json rather than a floating global install.
      - name: Build dashboard and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
